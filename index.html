<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosa: #ff69b4;
      --rosa-claro: #ffb6c1;
      --rosa-suave: #fff0f6;
      --branco: #ffffff;
      --verde: #8ee3b0;
      --azul: #8edcf4;
      --texto: #493b46;
      --whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Quicksand', sans-serif;
      color: var(--texto);
      background: linear-gradient(135deg, var(--rosa-suave) 0%, var(--branco) 52%, #eafaff 100%);
    }

    header {
      padding: 42px 20px;
      text-align: center;
      background: linear-gradient(135deg, var(--rosa-claro), var(--rosa));
      color: var(--branco);
      box-shadow: 0 4px 16px rgba(255, 105, 180, .28);
    }

    .logo {
      font-family: 'Pacifico', cursive;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      text-shadow: 2px 3px 5px rgba(0, 0, 0, .15);
    }

    .tagline { margin-top: 10px; font-size: 1.1rem; font-weight: 600; }
    .container { max-width: 1180px; padding: 42px 20px; margin: 0 auto; }
    .menu-section { margin-bottom: 52px; }

    .section-title {
      font-family: 'Pacifico', cursive;
      text-align: center;
      color: var(--rosa);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 3px dashed var(--rosa-claro);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 24px;
    }

    .product-card {
      width: 100%;
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      font: inherit;
      color: inherit;
      background: var(--branco);
      border: 2px solid transparent;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(255, 105, 180, .15);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    .product-card:hover,
    .product-card:focus-visible {
      transform: translateY(-7px);
      border-color: var(--rosa-claro);
      box-shadow: 0 16px 34px rgba(255, 105, 180, .22);
      outline: none;
    }

    .product-card:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }
    .product-image { width: 100%; height: 205px; object-fit: cover; display: block; background: linear-gradient(135deg, var(--verde), var(--azul)); }
    .product-info { padding: 18px; text-align: center; }
    .product-name { color: var(--rosa); font-size: 1.14rem; line-height: 1.35; min-height: 52px; }
    .product-price { display: inline-block; margin-top: 12px; padding: 7px 17px; border-radius: 999px; background: var(--rosa-suave); color: #219653; font-size: 1.25rem; font-weight: 700; }
    .click-to-order { display: block; margin-top: 10px; color: #168747; font-size: .82rem; font-weight: 700; }

    footer { padding: 32px 20px; text-align: center; background: linear-gradient(135deg, var(--azul), var(--verde)); color: var(--branco); }
    .footer-title { font-family: 'Pacifico', cursive; font-size: 1.9rem; margin-bottom: 12px; }
    .footer-info { line-height: 1.8; font-weight: 600; }

    .whatsapp-float {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 19px;
      border-radius: 999px;
      background: var(--whatsapp);
      color: var(--branco);
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(37, 211, 102, .38);
      transition: transform .2s ease, filter .2s ease;
    }

    .whatsapp-float:hover { transform: scale(1.05); filter: brightness(.95); }
    .whatsapp-icon { width: 25px; height: 25px; fill: currentColor; }

    @media (max-width: 520px) {
      .whatsapp-float { right: 16px; bottom: 16px; padding: 14px; }
      .whatsapp-label { display: none; }
      .product-image { height: 220px; }
    }
  </style>
</head>

  <script>
    const whatsappNumber = '5511989360383';
    const initialMessage = 'Olá, vim pelo cardápio da Lili Doces e gostaria de fazer um pedido!';

    document.querySelectorAll('.product-card').forEach((card) => {
      card.addEventListener('click', () => {
        const product = card.dataset.product;
        const message = `${initialMessage}\n\n${product}`;
        const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank', 'noopener,noreferrer');
      });
    });
  </script>
